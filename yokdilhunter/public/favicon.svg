<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#8b5cf6" flood-opacity="0.45" />
    </filter>
  </defs>
  <!-- Background Rounded Shield -->
  <rect x="32" y="32" width="448" height="448" rx="112" fill="#0f0f1a" />
  <rect x="48" y="48" width="416" height="416" rx="96" fill="url(#bgGrad)" filter="url(#shadow)" />
  <!-- Inner Glass Shine -->
  <rect x="48" y="48" width="416" height="208" rx="96" fill="white" opacity="0.12" />
  <!-- Text Emblem EG -->
  <text x="256" y="320" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="210" font-weight="900" letter-spacing="-8" fill="#ffffff" text-anchor="middle">EG</text>
  <!-- Sparkle Accent -->
  <path d="M 390 95 Q 400 125 430 135 Q 400 145 390 175 Q 380 145 350 135 Q 380 125 390 95 Z" fill="#fde047" />
</svg>
