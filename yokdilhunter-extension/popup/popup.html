<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YOKDILHUNTER</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  
  <div class="header">
    <div class="logo">
      <span class="logo-icon">📚</span>
      <h1>YOKDILHUNTER</h1>
    </div>
    <button id="logoutBtn" class="btn btn-outline" style="display: none;">Çıkış</button>
  </div>

  <div class="main-content">
    
    <!-- Login Screen -->
    <div id="loginScreen" class="screen">
      <p class="subtitle">Kelime avına devam etmek için giriş yap</p>
      
      <form id="loginForm">
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="email" required placeholder="ornek@email.com">
        </div>
        <div class="form-group">
          <label>Şifre</label>
          <input type="password" id="password" required placeholder="••••••••">
        </div>
        <button type="submit" class="btn btn-primary w-full" id="loginBtn">Giriş Yap</button>
      </form>
      <div id="loginError" class="error-msg"></div>
    </div>

    <!-- Authenticated Screen -->
    <div id="authScreen" class="screen" style="display: none;">
      
      <!-- Translation Mode Choice -->
      <div class="mode-card">
        <div class="mode-header">
          <span>Kayıt Sistemi:</span>
          <span id="currentModeLabel" class="mode-badge-ai">🤖 AI (4 Anlam)</span>
        </div>
        <div class="mode-buttons">
          <button type="button" id="btnModeAi" class="mode-btn active">
            <span class="mode-btn-icon">✨</span>
            <div class="mode-btn-text">
              <strong>Yeni Sistem (AI)</strong>
              <small>En çok kullanılan 4 anlam</small>
            </div>
          </button>
          <button type="button" id="btnModeClassic" class="mode-btn">
            <span class="mode-btn-icon">⚡</span>
            <div class="mode-btn-text">
              <strong>Eski Sistem</strong>
              <small>Klasik sözlük çevirisi</small>
            </div>
          </button>
        </div>
        <div style="margin-top: 8px; padding-top: 6px; border-top: 1px solid #334155; display: flex; gap: 4px; align-items: center;">
          <input type="password" id="geminiKeyInput" placeholder="Gemini API Key (AI için)..." style="font-size: 11px; padding: 4px 8px; flex: 1;">
          <button type="button" id="saveKeyBtn" class="btn btn-outline" style="font-size: 10px; padding: 4px 8px;">Kaydet</button>
        </div>
      </div>

      <div class="quick-add">
        <input type="text" id="manualWord" placeholder="Hızlı kelime ekle...">
        <button id="addBtn" class="btn btn-primary">+</button>
      </div>
      <div id="addError" class="error-msg"></div>

      <div class="recent-header">
        <h3>Son Kaydedilenler</h3>
      </div>
      
      <div id="loadingWords" class="loading">Yükleniyor...</div>
      
      <ul id="wordList" class="word-list">
        <!-- Words injected via JS -->
      </ul>

      <div class="tips">
        <p>💡 <b>İpucu:</b> Sayfada kelime seçip <b>sağ tıkla</b> veya <b>Ctrl+Shift+S</b> yap.</p>
      </div>
    </div>

  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
